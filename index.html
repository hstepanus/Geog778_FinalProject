<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVEC Predictive Grid</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="app-title">NOVEC Predictive Grid</div>
      <div class="app-subtitle">Clean Energy Adoption Explorer</div>
    </div>
    <div class="topbar-right">
      <div class="status-chip">
        <span class="status-dot"></span>
        Interactive Spatial Dashboard
      </div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <section class="panel">
        <h2 class="panel-title">Map Layers</h2>
        <p class="panel-text">
          Toggle density, hotspot, and cluster views for clean-energy adoption patterns
          across the NOVEC service area.
        </p>

        <div class="toggle-group">
          <button id="btnSolar" class="toggle-btn is-active">Solar Density</button>
          <button id="btnEV" class="toggle-btn">EV Density</button>
          <button id="btnHotspot" class="toggle-btn">Hotspots</button>
          <button id="btnLISA" class="toggle-btn">LISA Clusters</button>
          <button id="btnBase" class="toggle-btn">Base Map Only</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Overlays</h2>
        <div class="switch-row">
          <span class="switch-label">NOVEC Boundary</span>
          <button id="btnBoundary" class="switch-btn is-on" aria-pressed="true">
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
            <span class="switch-text">ON</span>
          </button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Current View</h2>
        <div id="layerLabel" class="current-layer">Solar Adoption Density</div>
      </section>

      <section class="panel chart-panel" id="chartPanel">
        <div class="chart-header">
          <h2 id="chartTitle" class="panel-title">Analysis Chart</h2>
          <button id="closeChartBtn" class="close-btn" type="button">×</button>
        </div>
        <img id="chartImage" src="" alt="Analysis chart" />
      </section>
    </aside>

    <section class="map-section">
      <div id="map"></div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./app.js"></script>
</body>
</html>
